    setTop('surface');
    var look = (S.settings && S.settings.look) || {};
    var block = function (key, label) {
      var cur = look[key] || COLOUR_DEFAULT[key];
      return '<section style="display:flex;flex-direction:column;gap:10px"><h2 class="h2">' + label + '</h2>' +
        '<div class="qchips" role="group" aria-label="' + label + ' colour">' + COLOUR_PRESETS.map(function (c) {
          return '<button class="chip" data-act="colourSet" data-arg="' + key + '|' + c[0] + '" aria-pressed="' + (cur.toLowerCase() === c[0].toLowerCase()) + '" aria-label="' + label + ': ' + c[1] + '" style="display:flex;align-items:center;gap:8px"><span aria-hidden="true" style="width:16px;height:16px;border-radius:5px;background:' + c[0] + ';display:inline-block"></span>' + c[1] + '</button>';
        }).join('') + '</div></section>';
    };
    return '<div class="screen">' + banner() +
      '<div class="topbar"><button class="back" data-act="back" aria-label="Back">' + ic('back', 24, 2) + '</button><h1>Colours</h1></div>' +
      '<div class="content">' +
      '<div class="card"><span class="t2">Preview on the home screen</span><div class="splitbar" aria-hidden="true" style="height:12px">' +
      '<span style="flex:3 1 0;background:' + (look.upi || COLOUR_DEFAULT.upi) + '"></span><span style="flex:2 1 0;background:' + (look.cash || COLOUR_DEFAULT.cash) + '"></span><span style="flex:1 1 0;background:#FFFFFF"></span></div>' +
      '<span class="t2">UPI, Cash and Card</span></div>' +
      block('cash', 'Cash colour') + block('upi', 'UPI colour') +
      '<section style="display:flex;flex-direction:column;gap:10px"><h2 class="h2">Button and text size</h2>' +
      '<div class="seg" role="group" aria-label="Button and text size">' + [['small', 'Small'], ['standard', 'Standard'], ['large', 'Large']].map(function (z) {
        var cur = look.size || 'standard';
        return '<button data-act="sizeSet" data-arg="' + z[0] + '" aria-pressed="' + (cur === z[0]) + '">' + z[1] + '</button>';
      }).join('') + '</div>' +
      '<p class="hint">Large makes the top buttons (like Close day), the action buttons and the text bigger. Small fits more on screen. Standard is the default.</p></section>' +
      '<button class="btn btn-soft block" data-act="colourReset">Reset to the standard colours</button>' +
      '<p class="hint">These colours only change the home screen bar and legend. Text, buttons and warnings keep their own colours so they stay easy to read.</p>' +
      '</div></div>' + navHtml('');
  };
  ACT.colourSet = function (el) {
    var parts = el.dataset.arg.split('|');
    if (!/^[a-z]+$/.test(parts[0]) || ['cash', 'upi'].indexOf(parts[0]) < 0 || !/^#[0-9A-Fa-f]{6}$/.test(parts[1])) return;
    S.settings.look = S.settings.look || {};
    S.settings.look[parts[0]] = parts[1];
    persist([kvOp('settings'), auditOp('Home colour changed', parts[0] + ' to ' + parts[1])]);
    applyTheme();
    render();
  };
  ACT.sizeSet = function (el) {
    var z = el.dataset.arg;
    if (['small', 'standard', 'large'].indexOf(z) < 0) return;
    S.settings.look = S.settings.look || {};
    if (z === 'standard') delete S.settings.look.size; else S.settings.look.size = z;
    persist([kvOp('settings'), auditOp('Button and text size changed', z)]);
    applyTheme();
    render();
  };
  ACT.colourReset = function () {
    delete S.settings.look;
    persist([kvOp('settings'), auditOp('Colours and size reset', '')]);
    applyTheme();
    render();
    toast('Standard colours restored.');
  };

  ACT.moreCat = function (el) { UI.moreCat = el.dataset.arg; render(); };
  ACT.moreGroup = function (el) {
    var g = el.dataset.arg || null, target = g ? 'moreGroup' : 'more';
    if (UI.screen !== target || UI.moreGroup !== g) UI.history = (UI.history || []).concat([{ screen: UI.screen, moreGroup: UI.moreGroup }]).slice(-30);
    UI.moreGroup = g;
    go(target, { noBack: true });
  };
  // ---------- computers (1100 px and wider): top navigation, search, notifications, profile, breadcrumbs ----------
  var DESK = window.matchMedia ? window.matchMedia('(min-width: 1100px)') : { matches: false };
  function isDesk() { return !!DESK.matches; }
  if (DESK.addEventListener) DESK.addEventListener('change', function () { UI.profileOpen = false; if (S.settings) render(); });
  var NO_CHROME = ['loading', 'setup', 'signin', 'cloudSignin', 'cloudShop', 'locked'];
  var GROUP_OF = { menu: 'shop', tablesSetup: 'shop', shop: 'shop', upi: 'shop', counter: 'shop', staff: 'team', pinSetup: 'team', language: 'look', colours: 'look', activity: 'data', errors: 'data', restore: 'data', plan: 'plan' };
  var GROUP_NAME = { shop: 'Shop', team: 'Team', look: 'Look', data: 'Data', plan: 'Plan' };
  var SCREEN_NAME = { home: 'Home', reminders: 'Payment reminders', order: 'New bill', collect: 'Collect payment', paid: 'Payment received', tables: 'Tables', kitchen: 'Kitchen', bills: 'Bills', reports: 'Reports', closeday: 'Close day', money: 'Money summary', more: 'More', expenses: 'Expenses', credit: 'Credit book', online: 'Online orders', menu: 'Menu and stock', tablesSetup: 'Tables and areas', shop: 'Business profile', upi: 'Payment methods', counter: 'This counter and bill numbers', staff: 'Staff and PINs', pinSetup: 'Manager PIN', language: 'Language', colours: 'Colours and size', activity: 'Activity log', errors: 'Error log', restore: 'Restore from a backup', plan: 'Plan and account' };
  function crumbTrail() {
    var s = UI.screen;
    // The trail starts at the person's own start screen: Home, or Tables for a waiter.
    var root = can('home') ? 'home' : homeFor();
    if (s === 'home' || s === root || !SCREEN_NAME[s] && s !== 'moreGroup') return [];
    var t = [[root === 'home' ? 'Home' : (SCREEN_NAME[root] || 'Tables'), 'nav', root]];
    if (s === 'collect' || s === 'paid') t.push(['New bill', '', '']);
    if (s === 'closeday') t.push(['Reports', 'nav', 'reports']);
    if (s === 'moreGroup' || GROUP_OF[s]) {
      t.push(['More', 'moreGroup', '']);
      var g = s === 'moreGroup' ? UI.moreGroup : GROUP_OF[s];
      if (s === 'moreGroup') t.push([GROUP_NAME[g] || 'Settings', '', '']);
      else t.push([GROUP_NAME[g], 'moreGroup', g]);
    }
    if (s !== 'moreGroup') t.push([SCREEN_NAME[s], '', '']);
    return t;
  }
  function deskbarHtml() {
    if (!isDesk() || !S.settings || NO_CHROME.indexOf(UI.screen) >= 0) return '';
    if (staffMode() && (!UI.user || UI.user.role === 'kitchen')) return '';
    var cur = UI.screen;
    var link = function (key, label) {
      if (key !== 'more' && !can(SCREEN_PERM[key] || key)) return '';
      return '<button class="dlink" data-act="nav" data-arg="' + key + '"' + (cur === key ? ' aria-current="page"' : '') + '>' + label + '</button>';
    };
    var alerts = alertsList().length;
    var who = UI.user ? UI.user.name : S.settings.shop.name;
    var role = UI.user ? ROLE_LABEL[UI.user.role] : 'Owner';
    var trail = crumbTrail();
    var crumbs = trail.length ? '<nav class="crumbs" aria-label="Breadcrumb"><ol>' + trail.map(function (c, i) {
      var last = i === trail.length - 1;
      return '<li>' + (last || !c[1] ? '<span' + (last ? ' aria-current="page"' : '') + '>' + esc(c[0]) + '</span>' : '<button class="crumb" data-act="' + c[1] + '" data-arg="' + c[2] + '">' + esc(c[0]) + '</button>') + '</li>';
    }).join('') + '</ol></nav>' : '';
    var menu = UI.profileOpen ? '<div class="pmenu" role="menu" aria-label="Profile menu"><div class="phead"><span class="t1">' + esc(who) + '</span><span class="t2">' + esc(role) + ' · ' + esc(S.settings.shop.name) + '</span></div>' + profileRows() + '</div>' : '';
    return '<header class="deskbar"><div class="dinner">' +
      '<button class="dlogo" data-act="nav" data-arg="home" aria-label="KIRO home">' + kiroMark() + '</button>' +
      '<div class="dlinks" role="navigation" aria-label="Main">' + link('home', 'Home') + link('tables', 'Tables') + link('kitchen', 'Kitchen') + link('bills', 'Bills') + link('reports', 'Reports') + link('more', 'More') + '</div>' +
      '<button class="dsearch" data-act="searchOpen" aria-keyshortcuts="Control+K" aria-label="Search dishes, bills and settings">' + ic('search', 18) + '<span>Search</span><kbd>Ctrl K</kbd></button>' +
      (can('sell') ? '<button class="btn btn-primary dnew" data-act="newBill">' + ic('plus', 18, 2.4) + 'New bill</button>' : '') +
      '<button class="dicon" data-act="alertsSheet" aria-label="Notifications' + (alerts ? ', ' + alerts + ' need attention' : '') + '">' + ic('bell', 22) + (alerts ? '<span class="dot" aria-hidden="true">' + alerts + '</span>' : '') + '</button>' +
      '<div class="dprofile"><button class="pchip" data-act="profileToggle" aria-haspopup="menu" aria-expanded="' + (UI.profileOpen ? 'true' : 'false') + '"><span class="pav" aria-hidden="true">' + esc(initials(who)) + '</span><span class="pname"><span>' + esc(who) + '</span><span>' + esc(role) + '</span></span>' + ic('chevron', 16, 2) + '</button>' + menu + '</div>' +
      '</div>' + crumbs + '</header>';
  }
  ACT.profileToggle = function () { UI.profileOpen = !UI.profileOpen; render(); };

  // Live bill beside the menu on computers, so the cashier sees every line while adding dishes.
  function liveBillHtml(o, bill) {
    if (!isDesk()) return '';
    var lines = liveLines(o);
    if (!lines.length) return '<div class="bill-live"><p class="t2" style="margin:0"></p></div>';
    return '<div class="bill-live" aria-label="Bill so far"><div class="bl-head"><span class="t1">Bill · ' + esc(whereOf(o)) + '</span></div><div class="bl-lines">' + lines.map(function (l, i) {
      return '<div class="bl-line"><span class="grow"><span class="t1" style="display:flex;align-items:center;gap:6px">' + mark(l.foodType) + esc(lineTitle(l)) + '</span><span class="t2">' + money(bill.lines[i].gross) + (l.kotNo ? ' · KOT ' + l.kotNo : '') + '</span></span>' +
        (l.unit === 'kg' ? '<span class="t2">' + E.qtyLabel(l) + '</span>' : '<span class="stepper sm"><button data-act="lineMinus" data-arg="' + l.id + '" aria-label="One less ' + esc(lineTitle(l)) + '">' + ic('minus', 16, 2.2) + '</button><span aria-label="Quantity">' + l.qty + '</span><button data-act="linePlus" data-arg="' + l.id + '" aria-label="One more ' + esc(lineTitle(l)) + '">' + ic('plus', 16, 2.2) + '</button></span>') + '</div>';
    }).join('') + '</div><div class="bl-sums">' + sumsHtml(bill) + '</div></div>';
  }

  // Search everything: dishes, bills and settings pages. Opens with Ctrl+K (Cmd+K on Mac).
  var SEARCH_PAGES = ['home', 'tables', 'kitchen', 'bills', 'reports', 'closeday', 'expenses', 'credit', 'online', 'menu', 'tablesSetup', 'shop', 'upi', 'counter', 'staff', 'pinSetup', 'language', 'colours', 'activity', 'errors', 'restore'];
  function searchResults(q) {
    q = (q || '').trim().toLowerCase();
    if (!q) return '<p class="t2" style="margin:0">Type a dish, a bill number, a customer or a setting.</p>';
    var out = [];
    S.items.filter(function (i) { return i.active && i.name.toLowerCase().indexOf(q) >= 0; }).slice(0, 5).forEach(function (i) {
      if (can('sell')) out.push('<button class="li" data-act="gsDish" data-arg="' + esc(i.name) + '"><span class="aic info" aria-hidden="true">' + ic('list', 20) + '</span><span class="grow"><span class="t1">' + esc(i.name) + '</span><span class="t2">Dish · start a bill with it</span></span></button>');
    });
    S.orders.filter(function (o) {
      return o.invoiceNo && ((o.invoiceNo || '').toLowerCase().indexOf(q) >= 0 || (o.customer.name || '').toLowerCase().indexOf(q) >= 0 || (o.customer.phone || '').indexOf(q) >= 0);
    }).slice(0, 5).forEach(function (o) {
      if (can('bills')) out.push('<button class="li" data-act="gsBill" data-arg="' + o.id + '"><span class="aic info" aria-hidden="true">' + ic('receipt', 20) + '</span><span class="grow"><span class="t1">' + esc(o.invoiceNo) + (o.customer.name ? ' · ' + esc(o.customer.name) : '') + '</span><span class="t2">Bill · ' + money(o.snapshot ? o.snapshot.total : 0) + '</span></span></button>');
    });
    SEARCH_PAGES.filter(function (k) { return SCREEN_NAME[k].toLowerCase().indexOf(q) >= 0 && screenAllowed(k); }).slice(0, 6).forEach(function (k) {
      out.push('<button class="li" data-act="gsPage" data-arg="' + k + '"><span class="aic info" aria-hidden="true">' + ic('chevron', 20) + '</span><span class="grow"><span class="t1">' + esc(SCREEN_NAME[k]) + '</span><span class="t2">Page</span></span></button>');
    });
    return out.length ? '<div class="panel">' + out.join('') + '</div>' : '<p class="t2" style="margin:0">Nothing matches “' + esc(q) + '”.</p>';
  }
  SHEETS.search = function () {
    return { autofocus: true, title: 'Search', body: '<div class="field"><label for="gs-q">Dishes, bills, customers or settings</label><input class="input" id="gs-q" type="search" autocomplete="off" placeholder="For example: dosa, A1/2627, Ravi, GST"></div><div id="gs-res" aria-live="polite">' + searchResults('') + '</div>' };
  };
  ACT.searchOpen = function () { UI.profileOpen = false; openSheet('search'); };
  ACT.gsDish = function (el) { closeSheet(true); ACT.newBill(); UI.q = el.dataset.arg; render(); };
  ACT.gsBill = function (el) { closeSheet(true); openSheet('billDetail', { orderId: el.dataset.arg }); };
  ACT.gsPage = function (el) { closeSheet(true); go(el.dataset.arg); };
  document.addEventListener('input', function (ev) {
    if (ev.target && ev.target.id === 'gs-q') {
      var box = document.getElementById('gs-res');
      if (box) { box.innerHTML = searchResults(ev.target.value); if (window.KiroI18N) KiroI18N.apply(box); }
    }
  });
  document.addEventListener('keydown', function (ev) {
    if ((ev.ctrlKey || ev.metaKey) && (ev.key === 'k' || ev.key === 'K') && S.settings && NO_CHROME.indexOf(UI.screen) < 0) {
      ev.preventDefault();
      ACT.searchOpen();
      return;
    }
    if (ev.key === 'Enter' && ev.target && ev.target.id === 'gs-q') {
      var first = document.querySelector('#gs-res .li');
      if (first) { ev.preventDefault(); first.click(); }
    }
  });
  document.addEventListener('click', function (ev) {
    if (!UI.profileOpen) return;
    var t = ev.target;
    if (t && t.closest && (t.closest('.dprofile'))) return;
    UI.profileOpen = false;
    render();
  }, true);

  // A small help mark beside complex labels. Shows on hover and on keyboard focus.
  function tip(text) {
    return ' <span class="tip" tabindex="0" role="note" aria-label="Help: ' + esc(text) + '" data-tip="' + esc(text) + '">i</span>';
  }

  // ---------- events ----------
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    if (el.getAttribute('data-act') === 'scrim' && ev.target !== el) return;
    var fn = ACT[el.getAttribute('data-act')];
    if (!fn) return;
    if (el.tagName === 'BUTTON' && el.type === 'submit' && el.form) return;
    // A link with a web address keeps its normal behaviour (it opens in a new tab); the action still runs.
    if (el.tagName === 'A' && el.getAttribute('href')) { try { fn(el, ev); } catch (e) { console.error(e); } return; }
    ev.preventDefault();
    if (UI.sheet && UI.sheet.name === 'profileMenu' && el.closest('.sheet')) closeSheet(true);
    try { fn(el, ev); } catch (e) { console.error(e); toast(e.message || 'Something went wrong.'); }
  });
  document.addEventListener('input', function (ev) {
    var el = ev.target.closest('[data-in]');
    if (el && INP[el.getAttribute('data-in')]) INP[el.getAttribute('data-in')](el);
  });
  document.addEventListener('change', function (ev) {
    var el = ev.target.closest('[data-ch]');
    if (el && CH[el.getAttribute('data-ch')]) CH[el.getAttribute('data-ch')](el);
  });
  document.addEventListener('submit', function (ev) {
    var form = ev.target.closest('[data-submit]');
    if (!form) return;
    ev.preventDefault();
    var fn = SUB[form.getAttribute('data-submit')];
    try { if (fn) fn(form); } catch (e) { console.error(e); toast(e.message || 'Something went wrong.'); }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && UI.sheet) { ev.preventDefault(); closeSheet(); }
  });
  // Keep timers on screen fresh (table minutes, alerts) without disturbing typing.
  setInterval(function () {
    if (document.hidden || UI.sheet) return;
    var a = document.activeElement;
    if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT')) return;
    if (['home', 'tables', 'kitchen'].indexOf(UI.screen) >= 0) render();
  }, 60000);

  // ---------- start ----------
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function (e) { console.warn('Offline cache not available', e); });
    });
  }
  try {
    var bc = new BroadcastChannel('kiro-pos');
    bc.onmessage = function (ev) {
      if (ev.data === 'hello') bc.postMessage('here');
      if ((ev.data === 'hello' || ev.data === 'here') && !UI.otherTab) { UI.otherTab = true; render(); }
    };
    bc.postMessage('hello');
  } catch (e) { /* older browsers: no warning */ }
  window.__kiro = { S: S, UI: UI, E: E, version: APP_VERSION, go: function (x, o) { go(x, o); }, openSheet: function (n, a) { openSheet(n, a); }, billOf: function (o) { return billOf(o); } };
  DB.open().then(function (ok) {
    if (!ok) UI.storageError = 'This browser is blocking storage, so bills will be lost when you close it. Open KIRO in a normal browser window.';
    return DB.readAll();
  }).then(function (all) {
    KV_KEYS.forEach(function (k) { if (all.kv[k] !== undefined) S[k] = all.kv[k]; });
    var split = validOrders(all.orders);
    S.orders = split.good;
    UI.damaged = split.bad;
    S.audit = all.audit || [];
    window.__kiro.S = S;
    applyTheme();
    S.billing = all.kv.billing || null;
    UI.errors = Array.isArray(all.kv.errors) ? all.kv.errors : [];
    UI.screen = S.settings ? (staffMode() ? 'signin' : 'home') : 'setup';
    if (CLOUD_OK) { startCloud().then(function () { render(); }); } else render();
  }).catch(function (e) {
    console.error(e);
    UI.storageError = 'Saved data could not be read on this device.';
    UI.screen = 'setup';
    render();
  });
})();

</script>
</body>
</html>
