<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF8F3">
<title>KIRO POS</title>
<style>
:root {
  --bg: #FBF8F3; --surface: #FFFFFF; --surface-2: #F4F7F8; --ink: #1D1D1F; --ink-2: #55555B;
  --line: #DCE4E6; --line-2: #C9D5D9;
  --brand: #F3E7D3; --on-brand-2: #FBF1E4; --brand-text: #F3E7D3; --brand-soft: #FBF1E4;
  --action: #F3E7D3; --on-action: #1D1D1F; --action-soft: #FBF1E4; --action-soft-ink: #8A6F4D;
  --danger: #1D1D1F; --danger-soft: #FBE4E2; --ok: #1D1D1F; --ok-soft: #FBF8F3; --cash: #6E6E73;
  --free-line: #6E6E73; --top-fill: var(--surface);
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-kiro-theme="light"]) {
    --bg: #0C1619; --surface: #14232A; --surface-2: #1A2C34; --ink: #E7DCC8; --ink-2: #C7C7CC;
    --line: #24363E; --line-2: #33474F;
    --brand: #F3E7D3; --on-brand-2: #FBF1E4; --brand-text: #F3E7D3; --brand-soft: #2B2B30;
    --action: #F3E7D3; --on-action: #1D1D1F; --action-soft: #2B2B30; --action-soft-ink: #F3E7D3;
    --danger: #8A6F4D; --danger-soft: #3A1D1B; --ok: #73D19B; --ok-soft: #173326; --cash: #6E6E73;
    --free-line: #6E6E73;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]:not([data-kiro-theme="light"]), :root[data-kiro-theme="dark"] {
  --bg: #0C1619; --surface: #14232A; --surface-2: #1A2C34; --ink: #E7DCC8; --ink-2: #C7C7CC;
  --line: #24363E; --line-2: #33474F;
  --brand: #F3E7D3; --on-brand-2: #FBF1E4; --brand-text: #F3E7D3; --brand-soft: #2B2B30;
  --action: #F3E7D3; --on-action: #1D1D1F; --action-soft: #2B2B30; --action-soft-ink: #F3E7D3;
  --danger: #8A6F4D; --danger-soft: #3A1D1B; --ok: #73D19B; --ok-soft: #173326; --cash: #6E6E73;
  --free-line: #6E6E73;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; margin: 0; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: 'Anek Latin', system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif;
  font-size: 15px; line-height: 1.35; -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--top-fill);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: var(--brand-text); }
:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg { flex: none; }

#app { max-width: 560px; margin: 0 auto; min-height: 100%; position: relative; }
.screen { padding-bottom: 112px; }
.screen.with-bar { padding-bottom: 170px; }
.banner { background: var(--danger-soft); color: var(--danger); padding: 10px 16px; font-weight: 600; font-size: 14px; }

/* home band */
.band { background: var(--brand); color: #1D1D1F; padding: 12px 16px 22px 20px; display: flex; flex-direction: column; gap: 16px; }
@media (min-width: 561px) { .band { border-radius: 0 0 24px 24px; } }
.band .row1 { display: flex; align-items: center; gap: 10px; }
.shopbtn { flex: 1; min-width: 0; min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 0; border: 0; background: none; color: #FFFFFF; text-align: left; }
.logo { width: 44px; height: 44px; flex: none; border-radius: 50%; background: var(--action); color: var(--on-action); display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; }
.shopname { display: block; font-size: 19px; font-weight: 600; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.on-brand-2 { color: var(--on-brand-2); }
.pill-ghost { height: 44px; flex: none; padding: 0 14px 0 12px; border-radius: 22px; border: 1.5px solid rgba(255, 255, 255, .4); background: transparent; color: #FFFFFF; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.round-ghost { position: relative; width: 44px; height: 44px; flex: none; border-radius: 22px; border: 0; background: rgba(255, 255, 255, .12); color: #FFFFFF; display: flex; align-items: center; justify-content: center; }
.round-ghost .dot { position: absolute; top: 9px; right: 10px; width: 9px; height: 9px; border-radius: 5px; background: var(--action); box-shadow: 0 0 0 2px var(--brand); }
.big-money { font-size: 56px; font-weight: 700; line-height: 1.05; letter-spacing: -0.5px; }
.meta-row { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 4px; font-size: 15px; color: var(--on-brand-2); }
.meta-row span { display: inline-flex; align-items: center; gap: 4px; }
.splitbar { display: flex; gap: 3px; height: 10px; }
.splitbar span { border-radius: 2px; min-width: 4px; }
.splitbar span:first-child { border-top-left-radius: 5px; border-bottom-left-radius: 5px; }
.splitbar span:last-child { border-top-right-radius: 5px; border-bottom-right-radius: 5px; }
.legend { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 10px; font-size: 14px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; }

.content { padding: 18px 16px 0; display: flex; flex-direction: column; gap: 20px; }
.h2 { margin: 0 4px; font-size: 17px; font-weight: 600; }
.h2row { display: flex; align-items: center; justify-content: space-between; margin: 0 4px; }
.h2row .h2 { margin: 0; }

.shortcuts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 4px; }
.sc { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; border: 0; background: none; color: var(--ink); font-size: 13.5px; line-height: 1.2; text-align: center; }
.sc .ic { width: 54px; height: 54px; border-radius: 17px; background: var(--surface); color: var(--brand-text); display: flex; align-items: center; justify-content: center; }
.sc .count { position: absolute; top: -5px; left: calc(50% + 14px); min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--action); color: var(--on-action); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.sc .soon { position: absolute; top: -7px; left: calc(50% + 8px); padding: 1px 6px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line-2); color: var(--ink-2); font-size: 11.5px; font-weight: 600; }
.sc .reddot { position: absolute; top: -3px; left: calc(50% + 17px); width: 12px; height: 12px; border-radius: 6px; background: #E7CFA6; box-shadow: 0 0 0 2px var(--bg); }

.panel { background: var(--surface); border-radius: 20px; padding: 2px 14px; display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); min-height: 64px; }
.li:last-child { border-bottom: 0; }
button.li, a.li { width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; color: var(--ink); text-decoration: none; }
.grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.t1 { font-size: 15.5px; font-weight: 600; }
.t2 { font-size: 14px; color: var(--ink-2); }
.amt { font-size: 17px; font-weight: 700; white-space: nowrap; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.aic { width: 40px; height: 40px; flex: none; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
.aic.warn { background: var(--action-soft); color: var(--action-soft-ink); }
.aic.bad { background: var(--danger-soft); color: var(--danger); }
.aic.good { background: var(--ok-soft); color: var(--ok); }
.aic.info { background: var(--brand-soft); color: var(--brand-text); }
.empty { padding: 22px 8px; text-align: center; color: var(--ink-2); }

/* buttons */
.btn { height: 56px; padding: 0 18px; border-radius: 16px; border: 2px solid transparent; font-size: 16.5px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; white-space: nowrap; }
.btn-primary { background: var(--action); color: var(--on-action); font-weight: 700; }
.btn-outline { background: var(--surface); color: var(--brand-text); border-color: var(--brand-text); }
.btn-soft { background: var(--surface-2); color: var(--ink); border-color: var(--line); }
.btn-danger { background: #E7CFA6; color: #1D1D1F; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-sm { height: 44px; padding: 0 16px; border-radius: 22px; font-size: 15px; }
.block { width: 100%; }
.flex1 { flex: 1; min-width: 0; }
.flex15 { flex: 1.5; min-width: 0; }
.link { min-height: 44px; padding: 0 6px; border: 0; background: none; color: var(--brand-text); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; }
.link.danger { color: var(--danger); }
.btnrow { display: flex; gap: 10px; }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); padding: 8px 14px 8px 8px; display: flex; align-items: center; gap: 6px; min-height: 61px; }
.topbar h1 { margin: 0; flex: 1; min-width: 0; font-size: 21px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar.plain h1 { padding-left: 10px; font-size: 24px; font-weight: 700; }
.back { width: 44px; height: 44px; flex: none; border-radius: 22px; border: 0; background: none; color: var(--ink); display: flex; align-items: center; justify-content: center; }
.chipbtn { height: 44px; flex: none; max-width: 150px; padding: 0 14px 0 12px; border-radius: 22px; border: 1.5px solid var(--line-2); background: var(--surface); color: var(--ink); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.chipbtn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.iconbtn { width: 44px; height: 44px; flex: none; border-radius: 22px; border: 1.5px solid var(--line-2); background: var(--surface); color: var(--ink); display: flex; align-items: center; justify-content: center; position: relative; }
.iconbtn.on { border-color: var(--brand-text); color: var(--brand-text); background: var(--brand-soft); }
.subbar { background: var(--surface); padding: 0 14px 14px 14px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid var(--line); }

/* segmented, chips, search */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; padding: 4px; border-radius: 14px; background: var(--bg); }
.seg button { height: 40px; border-radius: 10px; border: 0; background: transparent; color: var(--ink); font-weight: 500; padding: 0 6px; }
.seg button[aria-pressed="true"] { background: var(--brand); color: #1D1D1F; font-weight: 600; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { height: 40px; flex: none; padding: 0 16px; border-radius: 20px; border: 1.5px solid var(--line-2); background: var(--surface); color: var(--ink); font-weight: 500; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); font-weight: 600; }
.search { position: relative; flex: 1; min-width: 0; height: 48px; padding: 0 12px 0 14px; border-radius: 14px; background: var(--bg); color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.search input { flex: 1; min-width: 0; height: 44px; border: 0; padding: 0; background: transparent; color: var(--ink); font-size: 16px; outline: none; }
.search:focus-within { outline: 3px solid var(--action); outline-offset: 1px; }

/* menu tiles */
.items { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 12px 16px; }
@media (min-width: 520px) { .items { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tile { position: relative; min-height: 92px; padding: 12px 14px; border-radius: 16px; border: 2px solid var(--surface); background: var(--surface); color: var(--ink); text-align: left; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.tile.in { border-color: var(--action); background: var(--action-soft); }
.tile .nm { font-size: 16.5px; font-weight: 600; line-height: 1.2; }
.tile.in .nm { padding-right: 30px; }
.tile .pr { font-size: 15px; color: var(--ink-2); }
.tile .qty { position: absolute; top: 10px; right: 10px; min-width: 30px; height: 30px; padding: 0 8px; border-radius: 15px; background: var(--action); color: var(--on-action); font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.tile:disabled { border: 2px dashed var(--line-2); background: var(--surface-2); color: var(--ink-2); cursor: not-allowed; }
.mark { width: 16px; height: 16px; flex: none; }

/* fixed bars */
.actionbar, .nav { max-width: 560px; margin: 0 auto; }
.actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); border-radius: 24px 24px 0 0; padding: 12px 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
.actionbar .inner, .nav .inner { max-width: 528px; margin: 0 auto; }
.actionbar .inner { display: flex; flex-direction: column; gap: 10px; }
.barinfo { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.barinfo .totals { display: flex; flex-direction: column; align-items: flex-end; font-size: 14px; color: var(--ink-2); line-height: 1.3; text-align: right; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding: 0 6px calc(10px + env(safe-area-inset-bottom, 0px)); }
.nav .inner { height: 74px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: end; }
.nav button { min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; padding: 0; border: 0; background: none; color: var(--ink-2); font-size: 13px; font-weight: 500; }
.nav button[aria-current="page"] { color: var(--brand-text); font-weight: 700; }
.nav .fab { width: 66px; height: 66px; margin-top: -30px; border-radius: 33px; border: 5px solid var(--surface); background: var(--action); color: var(--on-action); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(11, 74, 88, .25); }
.nav .fablabel { color: var(--ink); font-weight: 700; }

/* sheets */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(8, 20, 24, .5); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 90%; overflow: auto; background: var(--surface); border-radius: 24px 24px 0 0; padding: 0 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 700px) { .scrim { align-items: center; } .sheet { border-radius: 24px; max-height: 86%; } }
.sheet-head { position: sticky; top: 0; z-index: 1; background: var(--surface); padding: 10px 0 4px; display: flex; align-items: center; gap: 8px; }
.sheet-head h2 { flex: 1; min-width: 0; margin: 0; font-size: 19px; font-weight: 600; }

/* forms */
.form { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .flabel { font-size: 14.5px; font-weight: 600; }
.input, select.input, textarea.input { height: 52px; padding: 0 14px; border-radius: 14px; border: 1.5px solid var(--line-2); background: var(--surface); color: var(--ink); font-size: 16px; width: 100%; }
textarea.input { height: auto; min-height: 80px; padding: 12px 14px; resize: vertical; }
.input:focus { outline: 3px solid var(--action); outline-offset: 1px; }
.input[aria-invalid="true"] { border-color: var(--danger); }
.hint { font-size: 13.5px; color: var(--ink-2); }
.err { font-size: 14px; color: var(--danger); font-weight: 600; }
.err:empty { display: none; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.prefix { display: flex; gap: 8px; }
.prefix .pre { height: 52px; flex: none; padding: 0 14px; border-radius: 14px; border: 1.5px solid var(--line-2); background: var(--surface-2); color: var(--ink-2); font-size: 16px; font-weight: 600; display: flex; align-items: center; }
.switchrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; }
.switchrow .grow { gap: 2px; }
.switch { appearance: none; -webkit-appearance: none; width: 52px; height: 32px; border-radius: 16px; background: var(--line-2); position: relative; flex: none; border: 0; margin: 0; cursor: pointer; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; transition: left .15s; }
.switch:checked { background: var(--brand); }
:root[data-theme="dark"]:not([data-kiro-theme="light"]) .switch:checked, :root[data-kiro-theme="dark"] .switch:checked { background: var(--brand-text); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]):not([data-kiro-theme="light"]) .switch:checked { background: var(--brand-text); } }
.switch:checked::after { left: 23px; }
.qchips { display: flex; flex-wrap: wrap; gap: 8px; }
.qchips .chip { height: 44px; }
.optlist { display: flex; flex-direction: column; gap: 8px; }
.opt { min-height: 52px; padding: 0 14px; border-radius: 14px; border: 1.5px solid var(--line-2); background: var(--surface); color: var(--ink); display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 500; text-align: left; }
.opt[aria-pressed="true"], .opt[aria-checked="true"] { border: 2px solid var(--brand-text); background: var(--brand-soft); font-weight: 600; }
.editrow { display: grid; grid-template-columns: 1fr 120px 44px; gap: 8px; align-items: center; }
.card { background: var(--surface); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

/* bill lines and totals */
.cline { display: flex; gap: 10px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); }
.cline:last-child { border-bottom: 0; }
.cline .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.stepper { display: flex; align-items: center; gap: 2px; background: var(--bg); border-radius: 24px; padding: 2px; flex: none; }
.stepper button { width: 44px; height: 44px; border-radius: 22px; border: 0; background: var(--surface); color: var(--ink); display: flex; align-items: center; justify-content: center; }
.stepper span { min-width: 30px; text-align: center; font-weight: 700; }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; background: var(--brand-soft); color: var(--brand-text); font-size: 12.5px; font-weight: 600; }
.tag.warn { background: var(--action-soft); color: var(--action-soft-ink); }
.tag.bad { background: var(--danger-soft); color: var(--danger); }
.tag.good { background: var(--ok-soft); color: var(--ok); }
.sums { display: flex; flex-direction: column; gap: 6px; }
.sumrow { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; }
.sumrow.muted { color: var(--ink-2); font-size: 14.5px; }
.sumrow.total { font-size: 19px; font-weight: 700; }
.dash { border-top: 1.5px dashed var(--line-2); }

/* collect */
.amount-hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 16px 16px 4px; }
.amount-hero .big { font-size: 64px; font-weight: 700; line-height: 1.05; letter-spacing: -0.5px; }
.methods { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.method { position: relative; height: 66px; padding: 0; border-radius: 16px; border: 1.5px solid var(--line-2); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.method[aria-pressed="true"] { border: 2px solid var(--brand-text); background: var(--brand-soft); color: var(--brand-text); font-weight: 700; }
.method .soon { position: absolute; top: -8px; right: -2px; padding: 0 5px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line-2); color: var(--ink-2); font-size: 11px; font-weight: 600; }
.qrbox { background: #FFFFFF; padding: 8px; border-radius: 14px; line-height: 0; }
.statusrow { align-self: stretch; padding-top: 12px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }

/* paid */
.success { background: var(--brand); color: #1D1D1F; padding: 32px 20px 76px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.success .check { width: 76px; height: 76px; margin-bottom: 8px; border-radius: 38px; background: var(--action); color: var(--on-action); display: flex; align-items: center; justify-content: center; }
.success h1 { margin: 0; font-size: 40px; font-weight: 700; line-height: 1.08; }
.receipt { position: relative; margin: -52px 16px 0; background: var(--surface); border-radius: 24px; padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 10px; }

/* tables */
.legend2 { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 14px 20px 0; font-size: 14px; }
.legend2 span { display: inline-flex; align-items: center; gap: 6px; }
.legend2 i { width: 14px; height: 14px; border-radius: 4px; }
.ttiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 14px 16px; }
@media (min-width: 520px) { .ttiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.ttile { min-height: 100px; padding: 10px 12px; border-radius: 16px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; }
.ttile.free { border: 1.5px dashed var(--free-line); background: var(--surface); color: var(--ink); }
.ttile.run { border: 2px solid var(--action); background: var(--action-soft); color: var(--ink); }
.ttile.billed { border: 2px solid var(--brand); background: var(--brand); color: #1D1D1F; }
.ttile .top { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.ttile .tn { font-size: 20px; font-weight: 700; line-height: 1.1; }
.ttile .small { display: inline-flex; align-items: center; gap: 3px; font-size: 13.5px; }
.ttile .muted { color: var(--ink-2); }
.ttile.billed .muted { color: var(--on-brand-2); }
.ttile .freetext { color: var(--ok); font-weight: 600; font-size: 14px; }
.ttile .latetext { color: var(--danger); font-weight: 600; }

/* kitchen */
.kots { display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; }
.kot { background: var(--surface); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; border: 2px solid var(--surface); }
.kot.new { border-color: var(--action); }
.kot.late { border-color: var(--danger); }
.kot .kh { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.kot ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.kot li { font-size: 16.5px; font-weight: 600; }
.kot li .note { display: block; font-size: 14px; font-weight: 500; color: var(--action-soft-ink); }

/* reports */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--surface); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 2px; }
.stat .v { font-size: 24px; font-weight: 700; }
.barrow { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; align-items: center; font-size: 14px; }
.bartrack { height: 12px; border-radius: 6px; background: var(--bg); overflow: hidden; }
.barfill { height: 100%; border-radius: 6px; background: var(--brand-text); }

/* toast */
#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; width: max-content; max-width: min(92vw, 440px); display: none; }
#toast.show { display: block; }
body[data-chrome="nav"] #toast { bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }
body[data-chrome="bar"] #toast { bottom: calc(170px + env(safe-area-inset-bottom, 0px)); }
.toastbox { background: #1D1D1F; color: #FFFFFF; border-radius: 14px; padding: 10px 10px 10px 16px; display: flex; gap: 12px; align-items: center; font-weight: 500; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); }
.toastbox button { border: 0; background: none; color: #F4A51C; font-weight: 700; min-height: 40px; padding: 0 8px; }



/* setup */
.setup-hero { background: var(--brand); color: #1D1D1F; padding: 36px 24px 30px; display: flex; flex-direction: column; gap: 10px; }
.setup-hero h1 { margin: 0; font-size: 30px; font-weight: 700; line-height: 1.1; }
.setup-hero p { margin: 0; color: var(--on-brand-2); font-size: 16px; }

/* print */
#print-area { display: none; }
@media print {
  @page { margin: 0; }
  :root { padding: 0 !important; }
  body { background: #FFFFFF !important; }
  body::before { display: none !important; }
  body > *:not(#print-area) { display: none !important; }
  #print-area { display: block !important; width: var(--paper, 80mm); padding: 3mm; color: #000000; background: #FFFFFF; font-family: Arial, Helvetica, sans-serif; font-size: 12px; line-height: 1.3; }
}
.r-center { text-align: center; }
.r-row { display: flex; justify-content: space-between; gap: 8px; }
.r-bold { font-weight: 700; }
.r-big { font-size: 15px; font-weight: 700; }
.r-hr { border-top: 1px dashed #000000; margin: 5px 0; }
.r-small { font-size: 10.5px; }

/* Staff limits: buttons a person may not use are not shown at all. */
body[data-noperm~="collect"] [data-act="toCollect"] { display: none !important; }
body[data-noperm~="void"] [data-act="voidAsk"], body[data-noperm~="void"] [data-act="cancelOrderAsk"] { display: none !important; }
body[data-noperm~="discount"] [data-act="discountSheet"] { display: none !important; }
body[data-noperm~="kot"] [data-act="sendKot"] { display: none !important; }

/* Keep the cash confirmation on screen while the cashier types or scrolls. */
.cash-go { position: sticky; bottom: 0; background: var(--surface); padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); margin-top: 4px; z-index: 5; }

/* ===== Responsive layer: fluid type, flexible sizes, rotation and foldables ===== */
:root {
  /* Type scales smoothly between a small phone and a wide desktop. Never below 14px for body text. */
  --fs-body: clamp(14px, 0.875rem + 0.15vw, 16px);
  --fs-small: clamp(12.5px, 0.78rem + 0.1vw, 14px);
  --fs-title: clamp(18px, 1rem + 0.7vw, 24px);
  --fs-hero: clamp(40px, 2.4rem + 4vw, 72px);
  --fs-money: clamp(44px, 2.6rem + 4vw, 80px);
  --space-x: clamp(12px, 0.6rem + 1.4vw, 24px);
  --cash: #6E6E73;
  --upi: #F3E7D3;
}
body { font-size: var(--fs-body); }
/* Use the visible height, so phone browser toolbars never hide the bottom buttons. */
html, body { min-height: 100%; min-height: 100dvh; }
#app { min-height: 100dvh; container-type: inline-size; }
.t1 { font-size: clamp(14.5px, 0.9rem + 0.2vw, 17px); }
.t2, .hint, .err { font-size: var(--fs-small); }
.amt { font-size: clamp(15px, 0.9rem + 0.4vw, 19px); }
.h2 { font-size: clamp(15.5px, 0.95rem + 0.3vw, 19px); margin-left: var(--space-x); margin-right: var(--space-x); }
.topbar h1 { font-size: var(--fs-title); }
.big-money { font-size: var(--fs-money); }
.setup-hero h1, .success h1 { font-size: var(--fs-hero); }
.content, .screen .content { padding-left: var(--space-x); padding-right: var(--space-x); }
.items { padding-left: var(--space-x); padding-right: var(--space-x); }
/* Buttons grow with their text rather than cutting it off. */
.btn { height: auto; min-height: 52px; padding-top: 12px; padding-bottom: 12px; font-size: clamp(15px, 0.95rem + 0.2vw, 17px); white-space: normal; text-align: center; line-height: 1.25; }
.btn-sm { min-height: 44px; }
.tile { min-height: clamp(84px, 6rem + 2vw, 116px); }
.tile .nm { font-size: clamp(15px, 0.9rem + 0.3vw, 18px); }
.tile .pr { font-size: var(--fs-small); }
.input, select.input, textarea.input { min-height: 52px; height: auto; }

/* Tile columns follow the width of the screen, not just its shape: 2 columns on phones, 3 on tablets, 4 on wide screens. */
.items { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@container (min-width: 520px) { .items { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@container (min-width: 900px) { .items { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@container (min-width: 1200px) { .items { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
@container (min-width: 520px) { .tt-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

/* Wide screens: the main column stays readable and centred; the bottom bars follow it. */
@media (min-width: 900px) {
  #app { max-width: 720px; }
  .actionbar, .nav { max-width: 720px; }
}
@media (min-width: 1400px) {
  #app { max-width: 820px; }
  .actionbar, .nav { max-width: 820px; }
}

/* Short landscape screens (phones turned sideways): compact headers and bars so the work area stays visible. */
@media (orientation: landscape) and (max-height: 500px) {
  .topbar { min-height: 52px; padding-top: 4px; padding-bottom: 4px; }
  .band { padding-top: 8px; padding-bottom: 12px; gap: 8px; }
  .big-money, .amount-hero .big { font-size: clamp(32px, 6vh, 48px); }
  .nav .inner { height: 60px; }
  .nav button { min-height: 48px; font-size: 12px; }
  .nav .fab { width: 56px; height: 56px; margin-top: -26px; }
  .actionbar { padding-top: 8px; padding-bottom: 8px; }
  .shortcuts { grid-template-columns: repeat(8, minmax(0, 1fr)); }
  .sc .ic { width: 44px; height: 44px; }
  .screen { padding-bottom: 116px; }
  .screen.with-bar { padding-bottom: 130px; }
  .sc .soon { top: -4px; left: calc(50% + 6px); font-size: 10.5px; }
  .sc { font-size: 12px; gap: 4px; }
}

/* Foldables and dual-screen devices (Android 'horizontal-viewport-segments'): keep the work on one panel and use the space well. */
@media (horizontal-viewport-segments: 2) {
  #app { max-width: calc(env(viewport-segment-width 0 0, 100vw) - 8px); }
  .actionbar, .nav { max-width: calc(env(viewport-segment-width 0 0, 100vw) - 8px); }
}

/* Very narrow phones (about 320px): keep the shop name and buttons from crowding. */
@media (max-width: 340px) {

  .pill-ghost { padding: 0 10px; font-size: 13px; }
  .shopname { font-size: 17px; }
  .shortcuts { gap: 10px 2px; }
  .sc { font-size: 12.5px; }
  .sc .ic { width: 48px; height: 48px; border-radius: 15px; }
}

/* Shop logo: a picture when one is set, otherwise the shop's initials. */
.logo img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }
.logo-card { flex-direction: row; align-items: center; flex-wrap: wrap; gap: 18px; }
.logo-big { width: 180px; height: 180px; border-radius: 22px; font-size: 24px; overflow: hidden; flex: none; }
.logo-actions { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; align-items: center; }

/* ===== Button styles: each home shortcut has its own colour, and main actions stand out ===== */
.shortcuts .sc .ic { border-radius: 18px; box-shadow: 0 2px 0 rgba(11, 74, 88, .10), 0 6px 14px rgba(11, 74, 88, .08); transition: transform .12s ease; }
.shortcuts .sc:active .ic { transform: translateY(2px) scale(.97); }
.shortcuts .sc:nth-child(1) .ic { background: #DDEFEA; color: #0B6B5A; }   /* Kitchen: green */
.shortcuts .sc:nth-child(2) .ic { background: #FDE8D7; color: #B4541B; }   /* Online orders: orange */
.shortcuts .sc:nth-child(3) .ic { background: #FBF1E4; color: #6B5A3E; }   /* Show QR: gold */
.shortcuts .sc:nth-child(4) .ic { background: #E4E9FB; color: #3A4DA6; }   /* Credit book: blue */
.shortcuts .sc:nth-child(5) .ic { background: #F3ECE0; color: #F3E7D3; }   /* Bills: teal */
.shortcuts .sc:nth-child(6) .ic { background: #F6E3F1; color: #8A2F78; }   /* Expenses: plum */
.shortcuts .sc:nth-child(7) .ic { background: #EFEAE1; color: #6B4E22; }   /* Stock: brown */
.shortcuts .sc:nth-child(8) .ic { background: #E7E7EE; color: #343449; }   /* Close day: slate */
.shortcuts .sc { font-weight: 600; }

.btn-primary { background: linear-gradient(180deg, #F3E7D3 0%, #F3E7D3 100%); box-shadow: 0 3px 0 #8A6F4D, 0 8px 18px rgba(0, 0, 0, .08); color: #12262C; }
.btn-primary:active { transform: translateY(2px); box-shadow: 0 1px 0 #8A6F4D; }
.btn-outline { background: var(--surface); border: 2px solid var(--brand-text); box-shadow: 0 2px 0 rgba(11, 74, 88, .12); }
.btn-outline:active { transform: translateY(1px); }
.btn-soft { box-shadow: 0 2px 0 rgba(11, 74, 88, .08); }
.btn-danger { box-shadow: 0 3px 0 #1D1D1F; }
.btn-danger:active { transform: translateY(2px); box-shadow: 0 1px 0 #1D1D1F; }

/* Shop-type buttons on Home and reports: pills that read as tappable */
.alert-go, .btn-sm.btn-outline { border-radius: 999px; }
.panel .li .btn-sm { min-width: 84px; }
.chip[aria-pressed="true"] { box-shadow: 0 3px 0 rgba(0, 0, 0, .25); }

/* Dark mode keeps the same colour families, just softened so they don't glare. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-kiro-theme="light"]) .shortcuts .sc:nth-child(1) .ic { background: #173A33; color: #7DDBC0; }
  :root:not([data-theme="light"]):not([data-kiro-theme="light"]) .shortcuts .sc:nth-child(2) .ic { background: #3D2817; color: #FFB27A; }
  :root:not([data-theme="light"]):not([data-kiro-theme="light"]) .shortcuts .sc:nth-child(3) .ic { background: #3A2E12; color: #8A6F4D; }
  :root:not([data-theme="light"]):not([data-kiro-theme="light"]) .shortcuts .sc:nth-child(4) .ic { background: #1D2544; color: #A9B8FF; }
  :root:not([data-theme="light"]):not([data-kiro-theme="light"]) .shortcuts .sc:nth-child(5) .ic { background: #EFE3CE; color: #F3E7D3; }
  :root:not([data-theme="light"]):not([data-kiro-theme="light"]) .shortcuts .sc:nth-child(6) .ic { background: #3A1E33; color: #E9A6DC; }
  :root:not([data-theme="light"]):not([data-kiro-theme="light"]) .shortcuts .sc:nth-child(7) .ic { background: #33291A; color: #E7DCC8; }
  :root:not([data-theme="light"]):not([data-kiro-theme="light"]) .shortcuts .sc:nth-child(8) .ic { background: #24243A; color: #C5C5DD; }
}

/* ===== Button and text size (More → Colours and size). Standard is the default. ===== */
:root { --ui: 1; }
html[data-size="small"] { --ui: 0.92; }
html[data-size="large"] { --ui: 1.18; }
body { font-size: calc(var(--fs-body) * var(--ui)); }
.topbar h1 { font-size: calc(var(--fs-title) * var(--ui)); }
.chipbtn { height: calc(44px * var(--ui)); font-size: calc(15px * var(--ui)); padding: 0 calc(14px * var(--ui)) 0 calc(12px * var(--ui)); }
.iconbtn, .round-ghost { width: calc(44px * var(--ui)); height: calc(44px * var(--ui)); }
.pill-ghost { height: calc(44px * var(--ui)); font-size: calc(15px * var(--ui)); }
.btn { min-height: calc(52px * var(--ui)); font-size: calc(16.5px * var(--ui)); }
.btn-sm { min-height: calc(44px * var(--ui)); font-size: calc(15px * var(--ui)); }
.link { font-size: calc(15px * var(--ui)); }
.sc { font-size: calc(13.5px * var(--ui)); }
.sc .ic { width: calc(54px * var(--ui)); height: calc(54px * var(--ui)); }
.chip { height: calc(40px * var(--ui)); font-size: calc(15px * var(--ui)); }
.tile .nm { font-size: calc(16.5px * var(--ui)); }
.nav button { font-size: calc(13px * var(--ui)); }

/* Kitchen top bar: name and avatar, then Show served and Sign out on the left, always with icons and words. Wraps onto two lines on narrow screens. */
.kitchen-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
.kitchen-profile { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 0 1 auto; max-width: 100%; }
.kitchen-avatar { width: 40px; height: 40px; border-radius: 20px; background: var(--action); color: var(--on-action); font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
.kitchen-who { display: flex; flex-direction: column; min-width: 0; }
.kitchen-title { margin: 0; font-size: 13px; color: var(--ink-2); font-weight: 600; line-height: 1.2; }
.kitchen-name { font-size: 17px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kitchen-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-start; flex: 1 0 100%; }
.kitchen-actions .chipbtn { flex: none; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
/* Kitchen buttons always show their full words. */
.kitchen-actions .chipbtn { max-width: none; }
.kitchen-actions .chipbtn span { max-width: none; overflow: visible; text-overflow: clip; white-space: nowrap; }

/* Amounts, the shop name and headings follow Small / Standard / Large too. */
.amt { font-size: calc(clamp(15px, 0.9rem + 0.4vw, 19px) * var(--ui)); }
.sumrow { font-size: calc(15px * var(--ui)); }
.big-money { font-size: calc(var(--fs-money) * var(--ui)); }
.shopname { font-size: calc(19px * var(--ui)); }
.setup-hero h1 { font-size: calc(var(--fs-hero) * var(--ui)); }
.kitchen-name { font-size: calc(17px * var(--ui)); }
.rules-table { width: 100%; border-collapse: collapse; font-size: calc(14px * var(--ui)); }
.rules-table th, .rules-table td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.rules-table th { color: var(--ink-2); font-weight: 600; }

/* ===== Kitchen on tablets and computers: full-width bar, menu at the right, order cards in columns ===== */
/* Kitchen uses the same centred desktop width as Home */
.kitchen-top { justify-content: space-between; padding: 12px clamp(14px, 2vw, 32px); }
.kitchen-menu-btn { margin-left: auto; }
.kitchen-profile { flex: 0 1 auto; }
.kitchen-title { font-size: clamp(13px, 0.8rem + 0.2vw, 15px); }
.kitchen-name { font-size: clamp(17px, 1rem + 0.4vw, 22px); }
@media (min-width: 700px) {
  #app:has(.kitchen-top) .kots { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; padding: 18px clamp(14px, 2vw, 32px); align-items: start; }
  .kot li { font-size: clamp(15px, 0.9rem + 0.3vw, 18px); }
}
@media (min-width: 1100px) {
  #app:has(.kitchen-top) .kots { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
}

/* ===== Bottom bars scale with the screen and run the full width on tablets and computers ===== */
.nav, .actionbar { max-width: none; height: auto; }
.nav .inner, .actionbar .inner { max-width: none; }
.nav .inner { height: clamp(74px, 6vh + 36px, 104px); }
.nav button, .nav a { font-size: clamp(13px, 0.8rem + 0.3vw, 17px); }
.nav svg { width: clamp(24px, 1.2rem + 0.8vw, 38px); height: clamp(24px, 1.2rem + 0.8vw, 38px); }
.nav button, .nav a { min-height: clamp(60px, 4vh + 36px, 84px); }
.nav .fab { width: clamp(66px, 3rem + 1vw, 84px); height: clamp(66px, 3rem + 1vw, 84px); border-radius: 50%; margin-top: calc(clamp(66px, 3rem + 1vw, 84px) / -2); }
.actionbar .btn { min-height: clamp(52px, 3.2rem + 1vw, 68px); font-size: clamp(15px, 0.95rem + 0.5vw, 21px); }
.actionbar .totals { font-size: clamp(13px, 0.8rem + 0.3vw, 17px); }
.actionbar .btnrow { gap: clamp(10px, 0.6rem + 0.8vw, 18px); }
@media (min-width: 700px) {
  .nav .inner { padding-left: clamp(16px, 2vw, 40px); padding-right: clamp(16px, 2vw, 40px); }
  .actionbar .inner { padding-left: clamp(12px, 2vw, 40px); padding-right: clamp(12px, 2vw, 40px); }
}

/* Table picker: each table shows whether it is free, has an open bill, or is waiting for payment. */
.tbl-legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: calc(13px * var(--ui)); color: var(--ink-2); }
.tbl-legend span { display: inline-flex; align-items: center; gap: 6px; }
.tbl-legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
.sw-free { border: 1.5px dashed var(--free-line); background: var(--surface); }
.sw-run { background: var(--action-soft); border: 2px solid var(--action); }
.sw-billed { background: var(--brand); }
.chip.tbl-free { border-style: dashed; }
.chip.tbl-run { background: var(--action-soft); border: 2px solid var(--action); color: var(--ink); font-weight: 700; }
.chip.tbl-billed { background: var(--brand); border-color: var(--brand); color: #1D1D1F; font-weight: 700; }

/* ===== Remaining screens use the full width on tablets and computers ===== */
@media (min-width: 900px) {
  #app { max-width: none; }
  .topbar, .subbar, .band, .chips, .legend2, .ttiles, .items { max-width: none; }
}
@media (min-width: 1100px) {
  /* Reports, More, Tables setup and similar screens: sections sit side by side instead of one long strip. */
  .content { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: clamp(14px, 1.4vw, 24px); align-items: start; }
  .content > .btn, .content > .hint, .content > .empty, .content > p, .content > .btnrow, .content > .banner { grid-column: 1 / -1; }
  .content > form.form { grid-column: 1 / -1; }
  .content > section, .content > .card, .content > .panel { min-width: 0; }
  .screen .content { padding-left: clamp(16px, 2vw, 40px); padding-right: clamp(16px, 2vw, 40px); }
}
@media (min-width: 1100px) and (max-width: 1400px) {
  .ttiles { grid-template-columns: repeat(5, minmax(0, 1fr)); }
}

/* Hindi and Telugu: fonts with the right letters, and taller lines so the marks don't touch. */
html[lang="hi"] body, html[lang="te"] body { font-family: 'Noto Sans Devanagari', 'Noto Sans Telugu', 'Nirmala UI', 'Mangal', 'Gautami', 'Nirmala', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; line-height: 1.55; }
html[lang="hi"] .big-money, html[lang="te"] .big-money { line-height: 1.2; }

/* Settings: one big button per group. */
.groupgrid { display: flex; flex-direction: column; gap: 12px; }
.groupcard { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 84px; padding: 14px 16px; border-radius: 20px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); text-align: left; box-shadow: 0 2px 0 rgba(11,74,88,.08); }
.groupcard:active { transform: translateY(1px); }
.groupcard .t1 { font-size: clamp(16px, 1rem + 0.3vw, 19px); }
.groupcard .t2 { font-size: clamp(13px, 0.85rem + 0.2vw, 15px); }
@media (min-width: 900px) { .groupgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); } .groupgrid > .card { grid-column: 1 / -1; } }

/* ===== Billing screen: bigger buttons for faster tapping ===== */
#app:has(.actionbar) .topbar .back, #app:has(.actionbar) .topbar .iconbtn { width: 52px; height: 52px; }
#app:has(.actionbar) .topbar .chipbtn { height: 52px; font-size: 16px; }
#app:has(.actionbar) .seg button { height: 50px; font-size: 17px; }
#app:has(.actionbar) .chip { height: 48px; font-size: 16px; padding: 0 18px; }

#app:has(.actionbar) .tile { min-height: 118px; padding: 14px 16px; }
#app:has(.actionbar) .tile .nm { font-size: 19px; }
#app:has(.actionbar) .tile .pr { font-size: 17px; }
#app:has(.actionbar) .tile .qty { min-width: 38px; height: 38px; font-size: 18px; border-radius: 19px; }
#app:has(.actionbar) .actionbar .btn { min-height: 66px; font-size: 19px; border-radius: 18px; }
#app:has(.actionbar) .actionbar .btn-sm { min-height: 60px; font-size: 17px; }
#app:has(.actionbar) .actionbar .totals { font-size: 16px; }
#app:has(.actionbar) .actionbar .btnrow { gap: 12px; }

/* ===== Computers (1100 px and wider): proportions that suit a monitor ===== */
@media (min-width: 1100px) {
  #app { max-width: 1200px; }
  /* Focused screens (payment, sign-in, forms) keep a comfortable reading width and sit in the middle. */
  #app:has(.methods) .screen > div:not(.topbar):not(.banner),
  #app:has(.amount-hero) .screen > div:not(.topbar):not(.banner),
  #app:has(.setup-hero) .screen > form,
  #app:has(.setup-hero) .screen > div:not(.setup-hero):not(.banner),
  #app:has(.topbar) .screen > .content.form { max-width: 760px; margin-left: auto; margin-right: auto; width: 100%; }
  .actionbar .inner, .nav .inner { max-width: 960px; }
  .nav .inner { height: 84px; }
  .nav svg { width: 28px; height: 28px; }
  .nav button, .nav a { font-size: 14px; min-height: 60px; }
  .nav .fab { width: 68px; height: 68px; margin-top: -34px; }
  .big-money { font-size: 64px; }
  .amount-hero .big { font-size: 56px; }
  .setup-hero h1 { font-size: 44px; }
  .actionbar .btn { min-height: 56px; font-size: 17px; }
  #app:has(.actionbar) .actionbar .btn { min-height: 56px; font-size: 17px; }
  #app:has(.actionbar) .tile { min-height: 96px; }
  #app:has(.actionbar) .tile .nm { font-size: 17px; }
  #app:has(.actionbar) .tile .pr { font-size: 15px; }
  .methods .method { height: 58px; }
  .groupcard { min-height: 72px; }
}


/* ===== KIRO intro (every launch, and after sign-in or sign-up) ===== */
.splash { position: fixed; inset: 0; z-index: 1000; background: radial-gradient(circle at 50% 42%, #FBF8F3 0%, #F3E7D3 45%, #EFE3CE 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; overflow: hidden; color: #1D1D1F; font-family: inherit; animation: spIn .25s ease-out both; }
.splash.sp-out { animation: spOut .35s ease-in both; }
.sp-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 56px 56px; }
.sp-mark { position: relative; display: flex; align-items: center; justify-content: center; }
.sp-ring { position: absolute; width: 120px; height: 120px; border-radius: 60px; border: 2px solid rgba(244,165,28,0.7); animation: spRing 1.6s ease-out infinite; }
.sp-ring.r2 { border-color: rgba(255,255,255,0.5); animation-delay: .8s; }
.sp-logo { position: relative; width: 104px; height: 104px; border-radius: 30px; background: linear-gradient(135deg, #F3E7D3, #F3E7D3); display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 50px rgba(0,0,0,0.35); animation: spPop .7s cubic-bezier(.2,.8,.2,1) .1s both; }
.sp-word { position: relative; font-size: clamp(68px, 15vw, 150px); font-weight: 800; letter-spacing: 0.08em; line-height: 1; }
.sp-word span { display: inline-block; animation: spLetter .6s cubic-bezier(.2,.8,.2,1) both; }
.sp-word span:nth-child(1) { animation-delay: .35s; } .sp-word span:nth-child(2) { animation-delay: .47s; }
.sp-word span:nth-child(3) { animation-delay: .59s; } .sp-word span:nth-child(4) { animation-delay: .71s; color: #F3E7D3; }
.sp-line { position: relative; width: clamp(180px, 40vw, 380px); height: 6px; border-radius: 3px; background: linear-gradient(90deg, #F3E7D3, #F3E7D3, #6E6E73); transform-origin: left; animation: spLine .6s ease-out .9s both; }
.sp-tag { position: relative; color: #E7DCC8; font-size: clamp(17px, 2vw, 22px); font-weight: 600; text-align: center; padding: 0 24px; animation: spFade .5s ease-out 1.1s both; }
.sp-skip { position: absolute; right: 24px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.3); color: #FFFFFF; font: inherit; font-weight: 700; font-size: 15px; padding: 10px 18px; min-height: 44px; border-radius: 999px; cursor: pointer; animation: spFade .5s ease-out .4s both; }
.sp-orb { position: absolute; display: flex; align-items: center; justify-content: center; animation: spOrb .5s cubic-bezier(.2,.8,.2,1) both; }
.sp-orb.o1 { left: 18%; top: 18%; width: 58px; height: 58px; border-radius: 50%; background: #F3E7D3; transform: rotate(-12deg); animation-delay: .9s; }
.sp-orb.o2 { right: 18%; top: 16%; width: 58px; height: 58px; border-radius: 18px; background: #FFFFFF; animation-delay: 1s; }
.sp-orb.o3 { left: 8%; top: 48%; width: 52px; height: 52px; border-radius: 26px; background: #6E6E73; animation-delay: 1.1s; }
.sp-orb.o4 { right: 8%; top: 50%; width: 52px; height: 52px; border-radius: 26px; background: #FFE6B0; color: #6B5A3E; font-weight: 800; font-size: 26px; animation-delay: 1.15s; }
.sp-orb.o5 { left: 22%; bottom: 16%; width: 54px; height: 54px; border-radius: 18px; background: #DCF8C6; transform: rotate(10deg); animation-delay: 1.25s; }
.sp-orb.o6 { right: 22%; bottom: 14%; width: 54px; height: 54px; border-radius: 50%; background: #F3E7D3; transform: rotate(-8deg); animation-delay: 1.3s; }
@keyframes spIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes spOut { from { opacity: 1; } to { opacity: 0; } }
@keyframes spPop { 0% { opacity: 0; transform: scale(.3) rotate(-40deg); } 60% { opacity: 1; transform: scale(1.12) rotate(6deg); } 100% { opacity: 1; transform: none; } }
@keyframes spLetter { 0% { opacity: 0; transform: translateY(48px) scale(.7); filter: blur(8px); } 100% { opacity: 1; transform: none; filter: blur(0); } }
@keyframes spLine { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes spFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes spOrb { from { opacity: 0; scale: 0; } to { opacity: 1; scale: 1; } }
@keyframes spRing { 0% { transform: scale(.6); opacity: .55; } 100% { transform: scale(2.4); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .splash { display: none !important; } }
@media print { .splash { display: none !important; } }

/* ===== Layout grid tokens: tablet 8 columns, 32 px margins, 16 px gutters; computer 12 columns, 80-120 px margins, 24 px gutters ===== */
:root { --grid-cols: 4; --gutter: 12px; }
@media (min-width: 700px) and (max-width: 1099px) {
  :root { --grid-cols: 8; --gutter: 16px; --space-x: 32px; }

<script>
// KIRO intro: plays on every app launch and after a sign-in or sign-up. Tap anywhere or Skip to close.
// Skipped for "reduce motion" and for automated test browsers, so it never blocks a cashier or a test run.
(function () {
  var first = document.getElementById('splash');
  var markup = first.outerHTML;
  var quiet = (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) || navigator.webdriver === true;
  function close(el) {
    if (!el || el.getAttribute('data-closing')) return;
    el.setAttribute('data-closing', '1');
    el.classList.add('sp-out');
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 350);
  }
  function wire(el) {
    var t = setTimeout(function () { close(el); }, 6000);
    el.addEventListener('click', function () { clearTimeout(t); close(el); });
  }
  if (quiet) first.parentNode.removeChild(first); else wire(first);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(document.getElementById('splash')); });
  window.kiroSplash = function (text) {
    if (quiet) return;
    var old = document.getElementById('splash');
    if (old && old.parentNode) old.parentNode.removeChild(old);
    var holder = document.createElement('div');
    holder.innerHTML = markup;
    var el = holder.firstElementChild;
    if (text) el.querySelector('#splash-tag').textContent = text;
    document.body.appendChild(el);
    wire(el);
  };
})();
</script>

    var W = 0;
    weights.forEach(function (w) {

  function qtyMilli(q) {

    if (!Number.isFinite(n) || n <= 0) fail('Quantity must be more than 0');
    if (n > MAX_QTY) fail('Quantity is too large');
    var m = Math.round(n * 1000);
    if (m < 1) fail('Quantity is too small');
    return m;
  }

  function lineUnitPaise(line) {
    var p = line.unitPricePaise;
    assertPaise(p, 'Price');
    if (p < 0 || p > MAX_UNIT_PAISE) fail('Price is out of range');
    (line.addons || []).forEach(function (a) {
      assertPaise(a.pricePaise, 'Add-on price');
      if (a.pricePaise < 0 || a.pricePaise > MAX_UNIT_PAISE) fail('Add-on price is out of range');
      p += a.pricePaise;

  }

  function lineGrossPaise(line) {

  function checkComponents(list) {
    (list || []).forEach(function (c) {
      if (!c || typeof c.code !== 'string' || !c.code) fail('Each tax part needs a name');
      if (!Number.isInteger(c.bp) || c.bp < 0 || c.bp > 10000) fail('Tax rate must be between 0 and 100%');
    });
  }

  function sumBp(list) {
    return (list || []).reduce(function (s, c) { return s + c.bp; }, 0);
  }

  function sum(a, b) { return a + b; }

  // A rate group's identity, e.g. "CGST:250|SGST:250".
  function sigOf(list) {
    return list.map(function (c) { return c.code + ':' + c.bp; }).sort().join('|');
  }

  /*
   * The one place a bill is worked out.
   * input = { lines, discount, ctx }
   *   lines:    [{ id, unitPricePaise, addons:[{pricePaise}], qty, taxComponents:[{code,bp}], cancelled }]
   *   discount: null | { type:'percent', bp } | { type:'amount', paise }

    var platform = !!ctx.taxByPlatform;
    var chargeTax = regime === 'regular' && !platform;
    var inclusive = !!ctx.pricesIncludeTax;

    var lines = (input.lines || []).filter(function (l) { return !l.cancelled; });
    var grosses = lines.map(lineGrossPaise);
    var subtotal = grosses.reduce(function (s, g) { return s + g; }, 0);

    var discount = 0;
    var d = input.discount;
    if (d) {

        if (!Number.isInteger(d.bp) || d.bp < 0 || d.bp > 10000) fail('Discount must be between 0 and 100%');

      } else if (d.type === 'amount') {
        assertPaise(d.paise, 'Discount');
        if (d.paise < 0) fail('Discount must not be negative');
        if (d.paise > subtotal) fail('Discount can’t be more than the bill');
        discount = d.paise;
      } else {
        fail('Unknown discount type');
      }
    }
    var shares = allocate(discount, grosses);
    var nets = grosses.map(function (g, i) { return g - shares[i]; });
    var comps = lines.map(function (l) {
      var c = chargeTax ? (l.taxComponents || []) : [];
      checkComponents(c);
      return c;
    });

    // GST is worked out on each rate group's total, then shared back to the lines.
    // This keeps the printed maths exact: "CGST 2.5% on ₹270.00 = ₹6.75".
    var lineTaxable = nets.slice();
    var lineTaxes = lines.map(function () { return []; });

    if (inclusive) {
      var incGroups = {};
      lines.forEach(function (l, i) {
        if (!comps[i].length) return;
        var s = sigOf(comps[i]);
        (incGroups[s] = incGroups[s] || { comps: comps[i], idx: [] }).idx.push(i);
      });
      Object.keys(incGroups).forEach(function (s) {
        var g = incGroups[s];
        var weights = g.idx.map(function (i) { return nets[i]; });
        var groupNet = weights.reduce(sum, 0);
        var base = mulDivRound(groupNet, 10000, 10000 + sumBp(g.comps));
        g.comps.forEach(function (c) {
          var parts = allocate(mulDivRound(base, c.bp, 10000), weights);
          g.idx.forEach(function (i, k) { lineTaxes[i].push({ code: c.code, bp: c.bp, paise: parts[k] }); });
        });
        g.idx.forEach(function (i) {
          lineTaxable[i] = nets[i] - lineTaxes[i].reduce(function (t, x) { return t + x.paise; }, 0);
        });
      });
    }

    var foodTaxable = lineTaxable.reduce(sum, 0);

    // Optional service charge, on the food value before tax. Off unless the shop turns it on.
    var scBp = ctx.serviceChargeBp || 0;

          var parts = allocate(mulDivRound(base, c.bp, 10000), g.weights);

      subtotal: subtotal,
      discount: discount,
      serviceCharge: sc,
      taxable: taxable,
      tax: tax,
      taxRows: taxRows,

  function paiseToDecimal(paise) {
    assertPaise(paise, 'Amount');

    var u = 'upi://pay?pa=' + upiEncode(opts.vpa) + '&pn=' + upiEncode(opts.name || '');
    if (opts.amountPaise) u += '&am=' + paiseToDecimal(opts.amountPaise);
    u += '&cu=INR';
    if (opts.note) u += '&tn=' + upiEncode(String(opts.note).slice(0, 50));

    gstin: function (s) { return /^\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(String(s || '')); },

    vpa: function (s) { return /^[a-zA-Z0-9.\-_]{2,256}@[a-zA-Z][a-zA-Z0-9.\-]{1,64}$/.test(String(s || '')); },
    series: function (s) { return SERIES_RE.test(String(s || '')); },

  function qtyLabel(line) {
    if (line.unit === 'kg') {

  }

  function billText(order, bill, shop) {
    var out = [];
    out.push(shop.name);
    if (bill.docType === 'bill_of_supply') out.push('Bill of supply');
    out.push('Bill ' + (order.invoiceNo || '(not final)'));
    var live = (order.lines || []).filter(function (l) { return !l.cancelled; });

    if (bill.discount) out.push('Discount  -' + formatINR(bill.discount));
    if (bill.serviceCharge.taxable) out.push('Service charge  ' + formatINR(bill.serviceCharge.taxable));
    bill.taxRows.forEach(function (t) { out.push(t.code + ' ' + percentLabel(t.bp) + '  ' + formatINR(t.paise)); });
    if (bill.roundOff) out.push('Round off  ' + formatINR(bill.roundOff));
    out.push('Total  ' + formatINR(bill.total));
    if (shop.gstin) out.push('GSTIN ' + shop.gstin);
    if (shop.footer) out.push(shop.footer);
    return out.join('\n');
  }

  return {
    MAX_UNIT_PAISE: MAX_UNIT_PAISE,
    divRound: divRound,
    mulDivRound: mulDivRound,
    allocate: allocate,
    qtyMilli: qtyMilli,
    lineGrossPaise: lineGrossPaise,
    computeBill: computeBill,
    dateParts: dateParts,
    financialYear: financialYear,
    invoiceNumber: invoiceNumber,
    formatINR: formatINR,
    paiseToDecimal: paiseToDecimal,
    parseRupees: parseRupees,
    parsePercentBp: parsePercentBp,
    percentLabel: percentLabel,
    paymentState: paymentState,
    upiLink: upiLink,
    qtyLabel: qtyLabel,
    billText: billText,
    valid: valid
  };
});

 * What it does: reads the shop's Google listing, compares it with KIRO, sends the phone number and opening hours

 *

 * There is no client secret and no refresh token; the access token lives in memory for about an hour.
 * Scope: https://www.googleapis.com/auth/business.manage
 *

 * consent screen is verified (business.manage is a sensitive scope). Until then use the sample mode.

  // A saved order must have the shape the app relies on. Anything else is set aside, never shown.
  function isUsableOrder(o) {

    if (!Array.isArray(o.lines) || !Array.isArray(o.kots) || !Array.isArray(o.payments)) return false;
    if (!o.customer || typeof o.customer !== 'object') return false;
    o.lines.forEach(function (l) { if (!l || typeof l.id !== 'string') throw new Error('line'); });
    if (['billed', 'paid'].indexOf(o.status) >= 0) {
      var s = o.snapshot;
      if (!s || typeof s !== 'object' || !Number.isSafeInteger(s.total) || !Number.isSafeInteger(s.discount) ||

    }

  function commitOrder(o, extraOps) {

    var counterBefore = JSON.stringify(S.counters);

  // Records a payment only after the device confirms the save. Returns a promise.

  function recordPayment(o, method, amountPaise, extra) {
    extra = extra || {};
    if (failing) return Promise.reject(new Error('This device cannot save right now, so payments are paused. Try again in a moment.'));
    if (!can('collect')) return Promise.reject(new Error('Only a cashier or manager can take payment.'));
    if (method === 'credit' && !custKey(o.customer)) return Promise.reject(new Error('Add the customer’s name or mobile number before recording credit.'));
    if (!(amountPaise > 0)) return Promise.reject(new Error('Enter an amount more than ₹0.'));
    var before = { status: o.status, invoiceNo: o.invoiceNo, paidAt: o.paidAt, n: o.payments.length };
    var counterBefore = JSON.stringify(S.counters);
    var preview;
    try {
      var bill = billOf(o);
      preview = E.paymentState(bill.total, o.payments);
      if (amountPaise > preview.due) return Promise.reject(new Error('That is more than the ' + money(preview.due) + ' still due.'));
    } catch (e) { return Promise.reject(e); }
    var ops = finalizeOps(o);
    var pay = { id: uid(), method: method, amountPaise: amountPaise, at: nowIso(), ref: extra.ref || '', tenderedPaise: extra.tenderedPaise || null, changePaise: extra.changePaise || 0 };
    o.payments.push(pay);
    var after = E.paymentState(o.snapshot.total, o.payments);
    if (after.due === 0) { o.status = 'paid'; o.paidAt = nowIso(); }
    o.updatedAt = nowIso();
    return saveAll(ops.concat([orderOp(o)])).then(function () { return after; }, function (err) {

      S.counters = JSON.parse(counterBefore);

    });

  function focusKey(el) {

  }

    if (CLOUD_OK && UI.screen !== 'loading') {
      if (!UI.cloudUser && CLOUD_SCREENS.indexOf(UI.screen) < 0) UI.screen = 'cloudSignin';
      else if (UI.cloudUser && !UI.cloud && UI.screen !== 'cloudShop' && UI.screen !== 'cloudSignin') UI.screen = 'cloudShop';
      else if (UI.cloudUser && UI.cloud && !planActive(UI.cloud) && CLOUD_SCREENS.indexOf(UI.screen) < 0) UI.screen = 'locked';
    }
    if (!screenAllowed(UI.screen)) UI.screen = homeFor();
    document.body.setAttribute('data-role', UI.user ? UI.user.role : '');
    document.body.setAttribute('data-noperm', ALL_PERMS.filter(function (p) { return !can(p); }).join(' '));
    var fn = SCREENS[UI.screen] || SCREENS.home;
    try {
      var deskOn = typeof isDesk === 'function' && isDesk();

    }
    document.body.setAttribute('data-chrome', ['home', 'tables', 'kitchen', 'bills', 'reports', 'more'].indexOf(UI.screen) >= 0 ? 'nav' : UI.screen === 'order' ? 'bar' : 'none');
    if (UI.sheet) renderSheet();
    if (UI.scrollTop) { window.scrollTo(0, 0); UI.scrollTop = false; }
    if (key) {
      var t = (UI.sheet ? sheetRoot.querySelector(key) : null) || appEl.querySelector(key);
      if (t && t !== document.activeElement) {
        try { t.focus({ preventScroll: true }); if (sel && t.setSelectionRange) t.setSelectionRange(sel[0], sel[1]); } catch (e) { /* ignore */ }
      }
    }
  }
  function go(screen, opts) {

  function sumsHtml(bill) {
    var rows = '<div class="sumrow"><span>Items</span><span>' + money(bill.subtotal) + '</span></div>';
    if (bill.discount) rows += '<div class="sumrow"><span>Discount</span><span>−' + money(bill.discount) + '</span></div>';
    if (bill.serviceCharge.taxable) rows += '<div class="sumrow"><span>Service charge ' + E.percentLabel(bill.serviceCharge.bp) + ' (optional)</span><span>' + money(bill.serviceCharge.taxable) + '</span></div>';

      rows += '<div class="sumrow muted"><span>Taxable value</span><span>' + money(bill.taxable) + '</span></div>';
      bill.taxRows.forEach(function (t) { rows += '<div class="sumrow muted"><span>' + esc(t.code) + ' ' + E.percentLabel(t.bp) + '</span><span>' + money(t.paise) + '</span></div>'; });

  // ---------- statistics ----------
  function dayStats(key) {
    var bills = S.orders.filter(function (o) { return o.billedAt && (o.status === 'billed' || o.status === 'paid') && dayKeyOf(o.billedAt) === key; });
    var sales = 0, disc = 0, by = { upi: 0, cash: 0, card: 0, credit: 0, platform: 0 }, taxRows = {}, taxable = 0;
    bills.forEach(function (o) {
      sales += o.snapshot.total;
      disc += o.snapshot.discount;
      taxable += o.snapshot.taxable;
      o.payments.forEach(function (p) { by[p.method] = (by[p.method] || 0) + p.amountPaise; });
      o.snapshot.taxRows.forEach(function (t) {
        var k = t.code + ' ' + E.percentLabel(t.bp);
        taxRows[k] = (taxRows[k] || 0) + t.paise;
      });
    });
    var exps = (S.expenses || []).filter(function (e) { return dayKeyOf(e.at) === key; });
    var reps = (S.ledger || []).filter(function (e) { return e.type === 'repayment' && dayKeyOf(e.at) === key; });
    var cashExp = exps.filter(function (e) { return e.method === 'cash'; }).reduce(function (s, e) { return s + e.amountPaise; }, 0);
    var repayCash = reps.filter(function (e) { return e.method === 'cash'; }).reduce(function (s, e) { return s + e.amountPaise; }, 0);
    var expTotal = exps.reduce(function (s, e) { return s + e.amountPaise; }, 0);
    var voids = S.orders.filter(function (o) { return o.status === 'void' && o.voidedAt && dayKeyOf(o.voidedAt) === key; });
    return {
      bills: bills, count: bills.length, sales: sales, discounts: disc, by: by, taxable: taxable, taxRows: taxRows,
      unpaid: sales - by.upi - by.cash - by.card - by.credit - by.platform, cashExp: cashExp, repayCash: repayCash, expTotal: expTotal, exps: exps,
      voidCount: voids.length, voidTotal: voids.reduce(function (s, o) { return s + o.snapshot.total; }, 0)
    };
  }
  function alertsList() {
    var list = [];
    if (S.settings && !S.settings.pay.upiId) list.push({ tone: 'info', icon: 'qr', title: 'Add your UPI ID', sub: 'Then customers can scan a QR code to pay you', act: 'goto', arg: 'upi', btn: 'Add' });
    S.orders.forEach(function (o) {
      if (o.status === 'billed') {
        var m = minsSince(o.billedAt);
        if (m >= 15) list.push({ tone: 'warn', icon: 'receipt', title: whereOf(o) + ' has not paid', sub: 'Bill printed ' + m + ' min ago', act: 'openCollect', arg: o.id, btn: 'Collect' });
      } else if (o.status === 'open' && o.lines.length) {
        var m2 = minsSince(o.createdAt);
        if (m2 >= LATE_MIN) list.push({ tone: 'bad', icon: 'clock', title: whereOf(o) + ' open for ' + m2 + ' min', sub: 'Check if they need anything', act: 'openOrder', arg: o.id, btn: 'Open' });
      }
    });
    var sold = S.items.filter(function (i) { return i.active && !i.inStock; }).length;
    if (sold) list.push({ tone: 'bad', icon: 'box', title: plural(sold, 'dish is', 'dishes are') + ' sold out', sub: 'Customers can’t order them until you turn them back on', act: 'goto', arg: 'menu', btn: 'View' });
    return list;

  function deskInsights(st) {
    var tk = todayKey();
    var sold = {};
    S.orders.forEach(function (o) {
      if ((o.status !== 'billed' && o.status !== 'paid') || !o.billedAt || dayKeyOf(o.billedAt) !== tk) return;
      o.lines.forEach(function (l) { var k = lineTitle(l); sold[k] = (sold[k] || 0) + l.qty; });
    });
    var top = Object.keys(sold).map(function (k) { return [k, sold[k]]; }).sort(function (a, b) { return b[1] - a[1]; }).slice(0, 5);
    var avg = st.count ? Math.round(st.sales / st.count) : 0;
    var rows = top.map(function (t) { return '<tr><td>' + esc(t[0]) + '</td><td class="tnum">' + t[1] + '</td></tr>'; });
    return '<section class="homesec desk-only"><div class="stat-row"><div class="card"><span class="t2">Average bill today</span><span class="stat-big">' + (st.count ? moneyC(avg) : '—') + '</span></div>' +

  // Checks a backup file before anything is changed. Anything unexpected is refused.
  function readBackup(text) {
    var doc;
    try { doc = JSON.parse(text); } catch (e) { return { ok: false, error: 'This file is not a valid backup. Choose a KIRO backup file.' }; }
    if (!doc || doc.app !== 'kiro-pos' || !doc.data || typeof doc.data !== 'object') return { ok: false, error: 'This is not a KIRO backup file.' };
    var d = doc.data;
    if (!d.settings || typeof d.settings !== 'object' || !d.settings.shop || typeof d.settings.shop.name !== 'string') return { ok: false, error: 'The backup has no shop details, so it cannot be restored.' };
    if (!Array.isArray(d.orders) || !Array.isArray(d.items || [])) return { ok: false, error: 'The backup’s bills or menu are damaged, so nothing was changed.' };
    var split = validOrders(d.orders);
    if (split.bad.length) return { ok: false, error: split.bad.length + ' bill(s) in this backup are damaged. Nothing was changed.' };
    return { ok: true, data: d, shop: d.settings.shop.name, bills: split.good.length, items: (d.items || []).length, when: doc.exportedAt ? fmtDate(doc.exportedAt) + ', ' + fmtTime(doc.exportedAt) : 'unknown' };
  }

  // ---------- sheets ----------
  var SHEETS = {};
  function openSheet(name, args) {
    var returnTo = document.activeElement;
    UI.sheet = { name: name, args: args || {}, state: {}, returnTo: returnTo };
    renderSheet(true);
  }
  function renderSheet(first) {
    if (!UI.sheet) { sheetRoot.innerHTML = ''; return; }
    var def = SHEETS[UI.sheet.name](UI.sheet.args, UI.sheet.state);
    var active = document.activeElement, key = !first && sheetRoot.contains(active) ? focusKey(active) : null;
    var sel = null;
    try { if (key && typeof active.selectionStart === 'number') sel = [active.selectionStart, active.selectionEnd]; } catch (e) { sel = null; }
    var scroll = sheetRoot.querySelector('.sheet');
    var st = scroll ? scroll.scrollTop : 0;
    sheetRoot.innerHTML = '<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">' +
      '<div class="sheet-head"><h2 id="sheet-title" tabindex="-1">' + def.title + '</h2><button class="iconbtn" data-act="closeSheet" aria-label="Close">' + ic('x', 20, 2) + '</button></div>' + def.body + '</div></div>';
    if (window.KiroI18N) KiroI18N.apply(sheetRoot);
    var sh = sheetRoot.querySelector('.sheet');
    if (sh) sh.scrollTop = st;
    if (first) {
      // Only jump into a text box when typing is the whole point, so phones don't pop the keyboard up for nothing.
      var f = def.autofocus ? sheetRoot.querySelector('.sheet input, .sheet select, .sheet textarea') : sheetRoot.querySelector('#sheet-title');
      if (f) try { f.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    } else if (key) {
      var t = sheetRoot.querySelector(key);
      if (t) try { t.focus({ preventScroll: true }); if (sel && t.setSelectionRange) t.setSelectionRange(sel[0], sel[1]); } catch (e) { /* ignore */ }
    }
  }
  function closeSheet(silent) {
    if (!UI.sheet) return;
    var s = UI.sheet;
    UI.sheet = null;
    sheetRoot.innerHTML = '';
    if (s.args && s.args.resolve && !s.done) s.args.resolve(false);
    if (!silent && s.returnTo && document.body.contains(s.returnTo)) try { s.returnTo.focus(); } catch (e) { /* ignore */ }
  }
  function sheetErr(msg) {
    var el = sheetRoot.querySelector('#sheet-err');
    if (el) el.textContent = msg || '';
  }

  var CLOUD = window.KIRO_CLOUD || { url: '', anonKey: '' };

  var SUPABASE_JS = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';
  var CLOUD_SCREENS = ['cloudSignin', 'cloudShop', 'locked', 'plan'];

  function planActive(c) {
    return !!c && (c.status === 'trial' || c.status === 'active') && new Date(c.end).getTime() > Date.now();
  }
  function planName(code) {
    return { free: 'Free', starter: 'Starter', pro: 'Pro' }[code] || code;
  }
  function loadSupabase() {
    if (window.supabase && window.supabase.createClient) return Promise.resolve(window.supabase);
    return new Promise(function (res, rej) {
      var sc = document.createElement('script');
      sc.src = SUPABASE_JS;
      sc.onload = function () { res(window.supabase); };
      sc.onerror = function () { rej(new Error('Could not load the sign-in library. Check the internet connection.')); };
      document.head.appendChild(sc);
    });
  }
  function cloudClient() {
    if (sb) return Promise.resolve(sb);
    return loadSupabase().then(function (lib) {
      sb = lib.createClient(CLOUD.url, CLOUD.anonKey, { auth: { persistSession: true, autoRefreshToken: true } });
      return sb;
    });
  }
  function saveBilling(acc) {
    S.billing = acc;
    persist([{ store: 'kv', key: 'billing', value: acc }]);
  }
  // Loads the signed-in person's shop and plan from the server and remembers it for offline use.
  function cloudSignedIn(client) {
    return client.rpc('claim_staff').then(function () { return client.rpc('my_account'); }).then(function (r) {
      if (r.error) throw r.error;
      var acc = r.data;
      if (!acc) { UI.cloud = null; UI.screen = 'cloudShop'; render(); return; }
      UI.cloud = { plan: acc.plan, status: acc.status, end: acc.end, role: acc.role, company: acc.company };
      saveBilling(UI.cloud);
      if (!S.settings) ensureLocalShop(acc.company.name);
      UI.cloudUser = true;
      UI.screen = planActive(UI.cloud) ? homeFor() : 'locked';
      render();
    });
  }
  function ensureLocalShop(name) {
    S.settings = defaultSettings(name, '');

    persist(KV_KEYS.map(kvOp).concat([auditOp('Shop set up', name)]));
    applyTheme();
  }
  // Runs once at start. Signed in and online: fresh plan. Offline: the saved plan, until it ends.
  function startCloud() {
    return cloudClient().then(function (client) {
      return client.auth.getSession().then(function (r) {
        var session = r.data && r.data.session;
        if (!session) { UI.cloudUser = false; UI.screen = 'cloudSignin'; return; }
        UI.cloudUser = true;
        return cloudSignedIn(client).catch(function () {
          if (S.billing && S.billing.company) {
            UI.cloud = S.billing;
            UI.screen = planActive(UI.cloud) ? (S.settings ? homeFor() : 'setup') : 'locked';
          } else {

            UI.screen = 'locked';

        return client.auth.signInWithOtp(target);
